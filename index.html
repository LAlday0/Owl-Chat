<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Owl Chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: rgb(255, 196, 44); border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: rgb(255, 255, 255); }

      #setup { display: flex; gap: 0.5rem; padding: 0.5rem; background: #fafafa; border-bottom: 1px solid #ddd; flex-wrap: wrap; align-items: center; }
      #setup input { padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 3px; }
      #setup button { background: rgb(255, 196, 44); border: none; padding: 0.45rem 0.9rem; border-radius: 3px; color: #fff; }
      #status { font-size: 0.8rem; color: #666; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
      #messages > li.system { color: #888; font-style: italic; }
      #messages > li.locked { color: #b00; }
      #messages .author { font-weight: 600; margin-right: 0.35rem; }
      #messages .cipher { display: block; font-family: monospace; font-size: 0.7rem; color: #999; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="setup">
      <input id="username" autocomplete="off" placeholder="username" />
      <input id="passphrase" type="password" autocomplete="off" placeholder="shared secret" />
      <button id="join">Join</button>
      <span id="status">Enter a username and the secret shared with your peer.</span>
      <label><input id="show-cipher" type="checkbox" /> show ciphertext</label>
    </div>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="message" /><button>Send</button>
    </form>
<script src="/socket.io/socket.io.js"></script>
<script src="/aes.js"></script>
<script src="/chat.js"></script>
  </body>
</html>
